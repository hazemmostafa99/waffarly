services:
  test-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: waffarly_test
      POSTGRES_PASSWORD: local_test_password
      POSTGRES_DB: waffarly_test
    ports:
      - '127.0.0.1:5434:5432'
    volumes:
      - waffarly-test-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U waffarly_test -d waffarly_test']
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  waffarly-test-postgres-data:
